name: CI

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace @forzy/web
      - run: npm run test:run --workspace @forzy/web
      - run: npm run build --workspace @forzy/web

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ocr, anomaly]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.lock
      - run: pip install -r services/${{ matrix.service }}/requirements.lock
      - run: ruff check services/${{ matrix.service }}/src services/${{ matrix.service }}/tests
      - run: pytest services/${{ matrix.service }}/tests
